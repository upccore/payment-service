x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/payments
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  API_KEY: ${API_KEY:-secret-api-key}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment: *app-environment
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  outbox-relay:
    build: .
    command: faststream run app.messaging.outbox_worker:app
    environment: *app-environment
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  consumer:
    build: .
    command: faststream run app.messaging.consumer:app
    environment: *app-environment
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
